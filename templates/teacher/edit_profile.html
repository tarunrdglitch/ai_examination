<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile Picture | DL Procted Examination</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dl-theme.css') }}">
    <style>
        body {
            margin: 0;
            font-family: var(--font-sans);
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .topbar {
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 14px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-xs);
        }

        .container {
            max-width: 540px;
            margin: 60px auto;
            background-color: #ffffff;
            box-shadow: var(--shadow-md);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            padding: 36px;
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--accent-gradient);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }

        .header-title {
            text-align: center;
            margin-bottom: 24px;
        }

        .header-title h2 {
            font-size: 1.45rem;
            font-weight: 800;
            margin: 0 0 6px;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .header-title p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .profile-pic-container {
            text-align: center;
            margin: 28px 0;
            position: relative;
        }

        .avatar-wrapper {
            display: inline-block;
            position: relative;
            cursor: pointer;
        }

        .avatar-wrapper img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            transition: all 0.25s ease;
        }

        .avatar-wrapper:hover img {
            filter: brightness(0.9);
            transform: scale(1.02);
        }

        .camera-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: var(--accent);
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(201, 28, 40, 0.4);
            border: 3px solid #ffffff;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
        }

        .save-btn {
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            background: var(--accent-gradient);
            color: #ffffff;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            box-shadow: var(--shadow-crimson);
            transition: all 0.2s ease;
            width: 100%;
        }

        .save-btn:hover {
            background: linear-gradient(135deg, #b91c1c 0%, #991b1b 100%);
            transform: translateY(-1px);
        }

        .remove-btn {
            padding: 11px;
            font-size: 0.9rem;
            font-weight: 600;
            background: #ffffff;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .remove-btn:hover {
            background: #fee2e2;
            color: #b91c1c;
            border-color: #fca5a5;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .back-link:hover {
            background: var(--bg-surface-hover);
            color: var(--text-primary);
        }

        .notification {
            display: none;
            text-align: center;
            padding: 12px;
            margin-bottom: 20px;
            background-color: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>

<body>
    <!-- Topbar -->
    <header class="topbar">
        <a href="/teacher/trdash" class="dl-brand">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="DL Procted Examination" class="dl-brand-logo">
            <div class="dl-brand-text">
                <span class="dl-brand-title">DL <span class="crimson">Procted</span></span>
                <span class="dl-brand-subtitle">Examination</span>
            </div>
        </a>
        <a href="/teacher/trdash" class="back-link">
            <i class="fas fa-arrow-left"></i> Dashboard
        </a>
    </header>

    <div class="container">
        <div class="header-title">
            <h2>Faculty Profile Photo</h2>
            <p>Upload a high-resolution portrait photograph for institutional identity records.</p>
        </div>

        <!-- Notification -->
        <div id="notification" class="notification">
            <i class="fas fa-check-circle"></i> Profile picture successfully updated!
        </div>

        <form method="POST" enctype="multipart/form-data">
            <div class="profile-pic-container">
                <label for="profile-picture" class="avatar-wrapper" title="Click to upload image">
                    {% if profile_image %}
                        <img src="data:image/jpeg;base64,{{ profile_image }}" id="profile-img" alt="Profile Preview">
                    {% else %}
                        <img src="https://ui-avatars.com/api/?name=Faculty&background=c91c28&color=fff&size=140" id="profile-img" alt="Profile Preview">
                    {% endif %}
                    <span class="camera-badge"><i class="fas fa-camera"></i></span>
                </label>
                <input type="file" id="profile-picture" name="profile_pic" accept="image/*">
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 10px;">Click image to browse file (PNG, JPG, max 5MB)</p>
            </div>

            <div class="button-group">
                <button type="submit" id="upload-btn" style="display: none" class="save-btn">
                    <i class="fas fa-cloud-arrow-up"></i> Upload New Picture
                </button>
                <button type="submit" name="remove" class="remove-btn">
                    <i class="fas fa-trash-can"></i> Remove Profile Picture
                </button>
            </div>
        </form>
    </div>

    <script>
    document.getElementById('profile-picture').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            document.getElementById('profile-img').src = url;
            document.getElementById('upload-btn').style.display = 'block';
        }
    });
    </script>
</body>

</html>
