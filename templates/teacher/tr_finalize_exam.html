<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalize Exam | DL Procted Examination</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dl-theme.css') }}">
    <style>
        body {
            margin: 0;
            font-family: var(--font-sans);
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 580px;
            width: 100%;
            background: #ffffff;
            padding: 36px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--accent-gradient);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand-logo {
            height: 38px;
            width: auto;
            object-fit: contain;
        }

        .brand-title {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .brand-title span {
            color: var(--accent);
        }

        .container h2 {
            margin: 0 0 8px;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .container p {
            margin: 0 0 24px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .container label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        .container input,
        .container textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 0.95rem;
            background: #ffffff;
            transition: all 0.2s ease;
        }

        .container input:focus,
        .container textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--accent-gradient);
            color: white;
            font-size: 0.95rem;
            font-weight: 700;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            box-shadow: var(--shadow-crimson);
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #b91c1c 0%, #991b1b 100%);
            transform: translateY(-1px);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="brand-header">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="DL Procted Examination" class="brand-logo">
            <div class="brand-title">
                DL <span>Procted</span> Examination
            </div>
        </div>

        <h2>Finalize Exam Parameters</h2>
        <p>Set duration and integrity guidelines to activate examination routing.</p>

        <form id="finalize-form" method="post" action="exam_link.html">
            <div class="form-group">
                <label for="exam-name">Exam Title</label>
                <input type="text" id="exam-name" name="exam-name" placeholder="e.g. Deep Learning Certification" required>
            </div>

            <div class="form-group">
                <label for="exam-duration">Exam Duration (minutes)</label>
                <input type="number" id="exam-duration" name="exam-duration" placeholder="e.g. 60" required>
            </div>

            <div class="form-group">
                <label for="exam-rules">Rules & Integrity Instructions</label>
                <textarea id="exam-rules" name="exam-rules" rows="4" placeholder="Camera must stay active, no auxiliary displays allowed..."></textarea>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fas fa-link"></i> Generate Exam Access Link
            </button>
        </form>
    </div>
</body>

</html>
