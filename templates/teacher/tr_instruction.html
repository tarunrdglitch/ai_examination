<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configure Exam Timing & Rules | DL Procted Examination</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dl-theme.css') }}">
    <style>
        body {
            margin: 0;
            font-family: var(--font-sans);
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            padding: 30px 20px;
        }

        .navbar-top {
            max-width: 720px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            background: #ffffff;
            padding: 36px 32px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
        }

        .form-header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .form-header h2 {
            font-size: 1.45rem;
            color: var(--text-primary);
            margin: 0 0 6px;
            font-weight: 800;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.88rem;
            margin-bottom: 6px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.92rem;
            font-family: inherit;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .form-helper {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 4px;
            display: block;
        }

        .submit-btn {
            background: var(--accent-gradient);
            color: white;
            padding: 12px 28px;
            border: 1px solid var(--accent);
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(201, 28, 40, 0.3);
            transition: all 0.2s ease;
            width: 100%;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #b91c1c 0%, #991b1b 100%);
            transform: translateY(-1px);
        }
    </style>
</head>

<body>
    <div class="navbar-top">
        <a href="/teacher/trdash" class="dl-brand">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="DL Procted Examination" class="dl-brand-logo">
            <div class="dl-brand-text">
                <span class="dl-brand-title">DL <span class="crimson">Procted</span></span>
                <span class="dl-brand-subtitle">Examination</span>
            </div>
        </a>
        <a href="/teacher/trdash" class="dl-btn dl-btn-secondary" style="padding: 6px 14px; font-size: 13px;">
            <i class="fas fa-arrow-left me-1"></i> Dashboard
        </a>
    </div>

    <div class="container">
        <div class="form-header">
            <h2>Proctoring Rules & Window Timing</h2>
            <p style="margin: 0; font-size: 0.88rem; color: var(--text-secondary);">Set the examination session duration, date, and candidate enforcement guidelines</p>
        </div>
        
        <form action="/instruction/{{ exam_id }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="exam-duration">Exam Duration (minutes)</label>
                <input type="number" class="form-control" id="exam-duration" name="exam-duration" placeholder="e.g. 60 or 90" required min="1">
                <span class="form-helper">Continuous countdown time allotted to examinees</span>
            </div>

            <div class="form-group">
                <label class="form-label" for="exam-rules">Proctoring Rules & Candidate Instructions</label>
                <textarea class="form-control" id="exam-rules" name="exam-rules" rows="4" placeholder="Enter specific instructions regarding allowable aids, webcam angle, or calculators..." style="resize: vertical;"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label" for="exam-date">Scheduled Examination Date</label>
                <input type="date" class="form-control" id="exam-date" name="exam-date" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="exam-time">Scheduled Start Time</label>
                <input type="time" class="form-control" id="exam-time" name="exam-time" required>
            </div>

            <button type="submit" class="submit-btn"><i class="fas fa-check-circle me-1"></i> Save Parameters & Generate Link</button>
        </form>
    </div>
</body>
</html>
