<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | DL Procted Examination</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dl-theme.css') }}">
    <style>
        body {
            margin: 0;
            font-family: var(--font-sans);
            background-color: var(--bg-canvas);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .auth-top-nav {
            position: absolute;
            top: 24px;
            left: 28px;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 38px 32px;
            box-shadow: var(--shadow-xl);
            text-align: center;
        }
        .auth-card img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            margin-bottom: 12px;
        }
        .auth-card h1 {
            font-size: 1.45rem;
            font-weight: 800;
            margin: 0 0 6px;
        }
        .auth-card p {
            font-size: 0.88rem;
            color: var(--text-secondary);
            margin: 0 0 24px;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.92rem;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .auth-btn {
            width: 100%;
            padding: 11px;
            background: var(--accent-gradient);
            color: #ffffff;
            border: 1px solid var(--accent);
            border-radius: var(--radius);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(201, 28, 40, 0.3);
            transition: all 0.2s ease;
            margin-top: 10px;
        }
        .auth-btn:hover {
            background: linear-gradient(135deg, #b91c1c 0%, #991b1b 100%);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="auth-top-nav">
        <a href="/" class="dl-brand">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="DL Procted Examination" class="dl-brand-logo">
            <div class="dl-brand-text">
                <span class="dl-brand-title">DL <span class="crimson">Procted</span></span>
                <span class="dl-brand-subtitle">Examination</span>
            </div>
        </a>
    </div>

    <div class="auth-card">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="DL Procted Examination">
        <h1>Create New Password</h1>
        <p>Ensure your new credentials meet institutional security rules</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="{{ url_for('reset_password', token=token) }}" method="POST">
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" placeholder="Enter new password" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" required minlength="6">
            </div>
            <button type="submit" class="auth-btn"><i class="fas fa-lock me-2"></i>Update Password</button>
        </form>
    </div>
</body>
</html>
