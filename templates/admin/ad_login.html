<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Sign In | DL Procted Examination</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dl-theme.css') }}">
    <style>
        body {
            margin: 0;
            font-family: var(--font-sans);
            background-color: var(--bg-canvas);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        .auth-top-nav {
            position: absolute;
            top: 24px;
            left: 28px;
            z-index: 20;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 38px 32px;
            box-shadow: var(--shadow-xl);
            position: relative;
            z-index: 10;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-header img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .auth-header h1 {
            font-size: 1.45rem;
            font-weight: 800;
            margin: 0 0 6px;
            color: var(--text-primary);
        }

        .auth-header p {
            font-size: 0.88rem;
            color: var(--text-secondary);
            margin: 0;
        }

        .role-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #09090b;
            color: #ffffff;
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .input-icon-box {
            position: relative;
        }

        .input-icon-box i.input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .input-icon-box input {
            width: 100%;
            padding: 11px 42px 11px 38px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.92rem;
            color: var(--text-primary);
            background: #ffffff;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .input-icon-box input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
        }

        .auth-btn {
            width: 100%;
            padding: 11px;
            background: var(--accent-gradient);
            color: #ffffff;
            border: 1px solid var(--accent);
            border-radius: var(--radius);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(201, 28, 40, 0.3);
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .auth-btn:hover {
            background: linear-gradient(135deg, #b91c1c 0%, #991b1b 100%);
            transform: translateY(-1px);
            box-shadow: var(--shadow-crimson);
        }

        .alert-box {
            display: none;
            background: var(--error-bg);
            color: var(--error);
            border: 1px solid var(--error-border);
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="auth-top-nav">
        <a href="/" class="dl-brand">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="DL Procted Examination" class="dl-brand-logo">
            <div class="dl-brand-text">
                <span class="dl-brand-title">DL <span class="crimson">Procted</span></span>
                <span class="dl-brand-subtitle">Examination</span>
            </div>
        </a>
    </div>

    <div class="auth-card">
        <div class="auth-header">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="DL Procted Examination">
            <h1>Platform Administration</h1>
            <p>Access high-privilege oversight, complaint logs & servers</p>
            <div><span class="role-pill"><i class="fas fa-shield-halved me-1"></i> Root Administrator</span></div>
        </div>

        <div id="authAlert" class="alert-box">
            <i class="fas fa-circle-exclamation me-1"></i> Invalid administrator credentials.
        </div>

        <form id="login-form" method="POST" action="/admin/login">
            <div class="form-group">
                <label for="username">Administrator ID</label>
                <div class="input-icon-box">
                    <i class="fas fa-user-shield input-icon"></i>
                    <input type="text" id="username" name="username" placeholder="Enter admin username" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Security Key / Password</label>
                <div class="input-icon-box">
                    <i class="fas fa-key input-icon"></i>
                    <input type="password" name="password" id="password" placeholder="Enter root password" required>
                    <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>

            <button type="submit" class="auth-btn">
                <i class="fas fa-lock-open me-2"></i> Authorize Admin Session
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center;">
            <a href="/" style="font-size: 0.85rem; color: var(--text-muted);"><i class="fas fa-arrow-left me-1"></i> Back to Main Portal</a>
        </div>
    </div>

    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');
        if (togglePassword && password) {
            togglePassword.addEventListener('click', function () {
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });
        }

        document.getElementById("login-form").addEventListener("submit", function (event) {
            event.preventDefault();
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const alertBox = document.getElementById("authAlert");

            if (username === "admin" && password === "admin012") {
                window.location.href = "/admin/adash";
            } else {
                alertBox.style.display = "block";
            }
        });
    </script>
</body>
</html>
