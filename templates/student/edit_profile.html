<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile Picture | DL Procted Examination</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dl-theme.css') }}">
    <style>
        body {
            margin: 0;
            font-family: var(--font-sans);
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-top-nav {
            position: absolute;
            top: 24px;
            left: 28px;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background-color: #ffffff;
            box-shadow: var(--shadow-xl);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border);
            padding: 36px 32px;
            text-align: center;
        }

        h2 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-primary);
            margin: 0 0 6px 0;
        }

        p.subtext {
            font-size: 0.88rem;
            color: var(--text-secondary);
            margin: 0 0 24px 0;
        }

        .profile-pic-container {
            text-align: center;
            margin-bottom: 24px;
            position: relative;
        }

        .profile-pic-container img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            border: 4px solid #ffffff;
            outline: 2px solid var(--accent);
            transition: all 0.2s ease;
        }

        .profile-pic-container img:hover {
            transform: scale(1.04);
            outline-color: var(--accent-hover);
        }

        .upload-hint {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--accent);
            cursor: pointer;
            margin-top: 10px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-upload {
            padding: 11px;
            font-size: 15px;
            background: var(--accent-gradient);
            color: #ffffff;
            border: 1px solid var(--accent);
            border-radius: var(--radius);
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(201, 28, 40, 0.28);
            transition: all 0.2s ease;
        }

        .btn-remove {
            padding: 10px;
            font-size: 14px;
            background: #ffffff;
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-remove:hover {
            background: var(--bg-surface-hover);
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-decoration: none;
        }
        .back-link:hover {
            color: var(--accent);
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>

<body>
    <div class="auth-top-nav">
        <a href="/studash" class="dl-brand">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="DL Procted Examination" class="dl-brand-logo">
            <div class="dl-brand-text">
                <span class="dl-brand-title">DL <span class="crimson">Procted</span></span>
                <span class="dl-brand-subtitle">Examination</span>
            </div>
        </a>
    </div>

    <div class="container">
        <h2>Verification Photo Update</h2>
        <p class="subtext">Click on the image below to choose a clear, front-facing portrait</p>

        <form method="POST" enctype="multipart/form-data">
            <div class="profile-pic-container">
                <label for="profile-picture">
                    <img src="{% if profile_image %}data:image/jpeg;base64,{{ profile_image }}{% else %}{{ url_for('static', filename='images/logo.png') }}{% endif %}" 
                         alt="Candidate Verification Portrait" 
                         id="profile-img">
                </label>
                <div>
                    <label for="profile-picture" class="upload-hint">
                        <i class="fas fa-camera"></i> Change Snapshot Photo
                    </label>
                </div>
                <input type="file" id="profile-picture" name="profile-picture" accept="image/*">
            </div>
        
            <div class="button-group">
                <button type="submit" id="upload-btn" style="display: none" class="btn-upload">
                    <i class="fas fa-cloud-arrow-up me-1"></i> Save Enrolled Snapshot
                </button>
                <button type="submit" name="remove" class="btn-remove">
                    <i class="fas fa-trash-can me-1 text-danger"></i> Remove Current Snapshot
                </button>
            </div>
        </form>

        <a href="/studash" class="back-link">
            <i class="fas fa-arrow-left me-1"></i> Return to Candidate Dashboard
        </a>
    </div>

    <script>
        document.getElementById('profile-picture').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                document.getElementById('profile-img').src = url;
                document.getElementById('upload-btn').style.display = 'block';
            }
        });
    </script>
</body>
</html>
