{% extends 'student/_layout.html' %}
{% block title %}Edit Academic Info{% endblock %}
{% block nav_profile %}active{% endblock %}
{% block content %}
<h2>Edit Academic Information</h2>
<form class="panel" method="POST" action="{{ url_for('edit_academic_info') }}">
    <label for="course">Course</label>
    <input type="text" id="course" name="course" value="{{ student_data.course or '' }}" required>

    <label for="year">Year</label>
    <select id="year" name="year" required>
        {% for y in ['1st Year', '2nd Year', '3rd Year', '4th Year', 'Graduate'] %}
            <option value="{{ y }}" {{ 'selected' if student_data.year == y else '' }}>{{ y }}</option>
        {% endfor %}
    </select>

    <button type="submit" class="btn">Save</button>
    <a class="btn secondary" href="{{ url_for('stu_profile') }}">Cancel</a>
</form>
{% endblock %}
