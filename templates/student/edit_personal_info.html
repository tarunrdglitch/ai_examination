{% extends 'student/_layout.html' %}
{% block title %}Edit Personal Info{% endblock %}
{% block nav_profile %}active{% endblock %}
{% block content %}
<h2>Edit Personal Information</h2>
<form class="panel" method="POST" action="{{ url_for('edit_personal_info') }}">
    <label for="fullname">Full name</label>
    <input type="text" id="fullname" name="fullname" value="{{ student_data.fullname or '' }}" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ student_data.email or '' }}" required>

    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone" value="{{ student_data.phone or '' }}" required>

    <label for="address">Address</label>
    <textarea id="address" name="address" rows="3" required>{{ '' if student_data.address == 'Not provided' else (student_data.address or '') }}</textarea>

    <button type="submit" class="btn">Save</button>
    <a class="btn secondary" href="{{ url_for('stu_profile') }}">Cancel</a>
</form>
{% endblock %}
